# Publishes the static frontend to GitHub Pages.
# The pages from src/frontend/html are placed at the site root so the public URLs
# (e.g. /JugendForscht.html, /contact.html) stay the same; css, js and assets sit next to them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir _site
          cp -R src/frontend/html/. _site/
          cp -R src/frontend/css src/frontend/js src/frontend/assets _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
